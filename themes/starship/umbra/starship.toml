# Umbra for Starship
# A compact, semantic prompt using the Umbra palette.

palette = "umbra"
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$line_break\
$character"""

right_format = "$python$nodejs$rust$cmd_duration$status"

[palettes.umbra]
ink = "#101111"
bone = "#C5C7C5"
muted = "#858A89"
lilac = "#B79BDD"
rose = "#C78995"
amber = "#CDA27C"
gold = "#D0B07C"
slate_blue = "#A9B4C8"
sage = "#83B89A"
sage_blue = "#9AB7B0"

[directory]
style = "fg:bone"
format = "[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "fg:muted"

[git_branch]
symbol = "git:"
style = "fg:lilac"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:muted"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
modified = "~"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = "py "
style = "fg:slate_blue"
format = "[$symbol$version]($style) "

[nodejs]
symbol = "node "
style = "fg:amber"
format = "[$symbol$version]($style) "

[rust]
symbol = "rs "
style = "fg:gold"
format = "[$symbol$version]($style) "

[cmd_duration]
min_time = 2_000
style = "fg:muted"
format = "took [$duration]($style) "

[status]
disabled = false
style = "fg:rose"
format = "[$symbol$status]($style)"
symbol = "status:"

[character]
success_symbol = "[❯](fg:sage_blue)"
error_symbol = "[❯](fg:rose)"
vimcmd_symbol = "[❮](fg:lilac)"
